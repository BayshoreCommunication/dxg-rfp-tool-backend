# Local development stack: every service the backend needs, with seed data, isolated from the
# integration suite (deploy/integration) and from any database in your .env / .env.local.
#
#   npm run stack:up      # start, migrate, grant the app role, seed
#   npm run stack:down    # stop, keep data
#   npm run stack:reset   # stop and delete all data, then stack:up again
#
# Ports are bound to loopback and sit in the 4xxxx range so they never collide with a default
# local Mongo/Postgres/Redis or with the integration stack (5xxxx).
name: rfpilotlocal

services:
  mongo:
    # Single-node replica set: sign-up writes the organization, user and membership in one
    # transaction, and Mongo only supports transactions on replica sets.
    image: mongo:7
    command: ["--replSet", "rs0", "--port", "47017", "--bind_ip_all"]
    ports: ["127.0.0.1:47017:47017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "47017", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:47017' }] }).ok }"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: rfpilot_local
      POSTGRES_DB: rfpilot_local
    ports: ["127.0.0.1:45432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfpilot_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["127.0.0.1:46379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email (sign-up codes, invitations, notifications). Inbox: http://127.0.0.1:48025
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:41025:1025", "127.0.0.1:48025:8025"]

volumes:
  mongo-data:
  postgres-data:

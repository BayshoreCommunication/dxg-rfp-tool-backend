name: Deploy to AWS

# main -> staging, production -> production. Authentication is GitHub OIDC
# only (no long-lived AWS keys): each branch may assume exactly one deploy
# role, created by the Rfpilot-Cicd stack. The deploy job is skipped until
# the repository variable AWS_ACCOUNT_ID is set, so this workflow is inert
# before the AWS account is bootstrapped.
#
# Pipeline: quality gates -> image build -> vulnerability scan -> ECR push
# (immutable sha-<commit> tag) -> one-off Postgres migration task -> CDK
# deploy of the app + observability stacks -> smoke checks.

on:
  push:
    branches:
      - main
      - production
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Manual re-run against the branch it is dispatched from (main -> staging,
  # production -> production) — e.g. after filling secrets or fixing infra.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ENV_NAME: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Application quality gate
        run: npm run ci
      - name: Infrastructure type-check and synth
        working-directory: deploy/aws
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk synth --strict -c nag=true --quiet

  deploy:
    name: Build, migrate, deploy (${{ github.ref_name == 'production' && 'production' || 'staging' }})
    needs: validate-account
    if: needs.validate-account.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rfpilot-${{ env.ENV_NAME }}-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t "${{ steps.ecr.outputs.registry }}/rfpilot-backend:sha-${GITHUB_SHA}" .

      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/rfpilot-backend:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push immutable image
        run: |
          # Promotion runs deploy a commit whose image an earlier branch's
          # run already pushed; the tag is immutable, so reuse it rather
          # than failing on the overwrite (same sha = same content).
          if aws ecr describe-images --repository-name rfpilot-backend \
               --image-ids imageTag="sha-${GITHUB_SHA}" > /dev/null 2>&1; then
            echo "Image sha-${GITHUB_SHA} already in ECR — reusing it."
          elif ! docker push "${{ steps.ecr.outputs.registry }}/rfpilot-backend:sha-${GITHUB_SHA}"; then
            # A same-sha run on the other branch can push between our check
            # and our push (main and production move together on promotion).
            # If the tag exists now, that is the same content — reuse it.
            aws ecr describe-images --repository-name rfpilot-backend \
              --image-ids imageTag="sha-${GITHUB_SHA}" > /dev/null
            echo "Concurrent run pushed sha-${GITHUB_SHA} first — reusing it."
          fi

      - name: Read stack outputs
        id: outputs
        run: |
          set -euo pipefail
          get_output() {
            aws cloudformation describe-stacks --stack-name "Rfpilot-${ENV_NAME}-App" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "cluster=$(get_output ClusterName)"        >> "$GITHUB_OUTPUT"
          echo "subnets=$(get_output PrivateSubnetIds)"   >> "$GITHUB_OUTPUT"
          echo "migrate_sg=$(get_output MigrateSecurityGroupId)" >> "$GITHUB_OUTPUT"
          echo "alb=$(get_output AlbDnsName)"             >> "$GITHUB_OUTPUT"

      - name: Run Postgres migrations (one-off task, new image)
        run: |
          set -euo pipefail
          # Register a migrate task-definition revision that points at the
          # image built above, so new migration files ship with the code that
          # needs them — while the running services stay on the old image
          # until the deploy step.
          FAMILY="rfpilot-${ENV_NAME}-migrate"
          IMAGE="${{ steps.ecr.outputs.registry }}/rfpilot-backend:sha-${GITHUB_SHA}"
          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition' > taskdef.json
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)' taskdef.json > taskdef-new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ steps.outputs.outputs.cluster }}" \
            --task-definition "$NEW_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(echo '${{ steps.outputs.outputs.subnets }}' | tr ',' ',')],securityGroups=[${{ steps.outputs.outputs.migrate_sg }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "${{ steps.outputs.outputs.cluster }}" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ steps.outputs.outputs.cluster }}" \
            --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      - name: Deploy application stacks
        working-directory: deploy/aws
        run: |
          npm ci
          # Domain/cert/URL contexts come from environment-scoped GitHub
          # variables (empty = HTTP bootstrap mode, see app-stack.ts), so a
          # plain code push can never strip HTTPS from a configured env.
          #
          # --exclusively: NEVER implicitly deploy dependency stacks. The
          # Data stack owns the app secret via secretObjectValue; deploying
          # it resets every operator-filled value to REPLACE_ME (this bit us
          # on 2026-08-02). Data/Network changes are deliberate manual
          # deploys per the README runbook.
          npx cdk deploy "Rfpilot-${ENV_NAME}-App" "Rfpilot-${ENV_NAME}-Observability" \
            --exclusively \
            --require-approval never \
            -c imageTag="sha-${GITHUB_SHA}" \
            -c env="${ENV_NAME}" \
            -c certificateArn="${{ vars.CERTIFICATE_ARN }}" \
            -c apiDomain="${{ vars.API_DOMAIN }}" \
            -c frontendUrl="${{ vars.FRONTEND_URL }}" \
            -c adminUrl="${{ vars.ADMIN_URL }}"

      - name: Smoke checks
        run: |
          set -euo pipefail
          # -kL: follow the 80->443 redirect once HTTPS exists; the ALB's
          # default DNS name is not on the certificate, so skip verification
          # for this infrastructure smoke check only.
          ALB="${{ steps.outputs.outputs.alb }}"
          for i in $(seq 1 20); do
            CODE=$(curl -skL -o /dev/null -w '%{http_code}' "http://${ALB}/" || true)
            [ "$CODE" = "200" ] && break
            echo "waiting for API ($CODE)..."; sleep 15
          done
          [ "$CODE" = "200" ]
          HEALTH=$(curl -skL -o /dev/null -w '%{http_code}' "http://${ALB}/health" || true)
          echo "GET / -> 200, GET /health -> ${HEALTH}"
          [ "$HEALTH" = "200" ]

  validate-account:
    name: Check AWS bootstrap
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check AWS_ACCOUNT_ID repository variable
        id: check
        run: |
          if [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "AWS_ACCOUNT_ID repository variable is not set — deploy skipped (AWS not bootstrapped yet)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - ai-agent

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run ci

  integration:
    # Real Postgres (row-level security), Mongo (replica set) and Redis. Includes the
    # cross-tenant isolation suite (ORG-108): an unscoped route fails this job.
    name: Integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start Postgres, Mongo and Redis
        run: npm run integration:up

      - name: Run integration suite
        run: npm run test:integration

      - name: Stop services
        if: always()
        run: npm run integration:down

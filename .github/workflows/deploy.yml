name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run ci

  deploy:
    name: Deploy to DigitalOcean
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            set -e
            export NVM_DIR="/root/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd /var/www/dxg-rfp-tool-backend

            echo "📥 Pulling latest code..."
            git pull --ff-only origin main

            echo "📦 Installing locked dependencies..."
            npm ci

            echo "🏗️ Building the validated source release..."
            npm run build

            echo "🧹 Removing development-only dependencies..."
            npm prune --omit=dev

            echo "♻️ Restarting PM2..."
            pm2 restart dxg-rfp-tool
            pm2 save

            echo "✅ Deployment complete!"
            pm2 status
          ENDSSH
